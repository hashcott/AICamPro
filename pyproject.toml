[project]
name = "aicampro"
version = "0.1.0"
description = "Webcam AI cho Linux: xoá/thay nền, filter màu, làm đẹp, auto-framing — tăng tốc bằng GPU AMD qua ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",          # cài từ index ROCm, xem scripts/setup_env.sh
    "torchvision>=0.20",
    "PySide6>=6.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyvirtualcam>=0.11",
]

[project.scripts]
aicampro = "aicampro.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aicampro*"]

[tool.setuptools.package-data]
aicampro = ["assets/luts/*.cube", "assets/backgrounds/*.jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

# Chọn luật tường minh: mặc định của ruff thay đổi giữa các phiên bản, để trống
# thì CI và máy lập trình viên sẽ cho kết quả khác nhau.
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # ký tự Unicode "mơ hồ" — tài liệu và chuỗi giao diện bằng tiếng Việt
    "RUF002",
    "RUF003",
    "B008",    # gọi hàm trong giá trị mặc định — Qt và dataclass field dùng nhiều
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]        # importorskip bắt buộc phải đứng trước import
