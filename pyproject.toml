[project]
name = "soi"
version = "0.1.0"
description = "Webcam AI cho Linux: xoá/thay nền, filter màu, làm đẹp, auto-framing — tăng tốc bằng GPU AMD qua ROCm"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5",          # cài từ index ROCm, xem scripts/setup_env.sh
    "torchvision>=0.20",
    "PySide6>=6.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyvirtualcam>=0.11",
]

[project.scripts]
soi = "soi.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["soi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
