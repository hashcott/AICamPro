name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # A release must never be cut from a tree that fails its own checks, so
      # these run here rather than trusting a green CI run on an earlier commit.
      - run: pip install ruff==0.16.3 pytest
      - run: ruff check aicampro tests
      - run: python -m pytest -q
      - name: Tag must match the version in pyproject
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "v$VERSION" ] || { echo "Tag $TAG != pyproject $VERSION" >&2; exit 1; }

  python:
    name: sdist and wheel
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: python-dist, path: dist/* }

  deb:
    name: deb package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - run: sudo apt-get update && sudo apt-get install -y fakeroot lintian
      - run: ./packaging/build-deb.sh
      - name: lintian must be clean
        run: lintian --fail-on warning --tag-display-limit 0 dist/*.deb
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  appimage:
    name: AppImage
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      # appimagetool needs FUSE to self-mount; the runner has libfuse2 available
      - run: sudo apt-get update && sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
      - run: ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: dist/*.AppImage }

  publish:
    name: publish
    needs: [python, deb, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }

      - name: Extract the release notes for this version
        run: |
          python - "$TAG" <<'PY' > release-notes.md
          import re, sys
          from pathlib import Path
          version = sys.argv[1].lstrip("v")
          text = Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\].*?$\n(.*?)(?=^## \[|\Z)",
                            text, re.MULTILINE | re.DOTALL)
          print(match.group(1).strip() if match
                else f"See CHANGELOG.md for the {version} entry.")
          PY
          cat >> release-notes.md <<'NOTE'

          ---

          ### Which download

          | File | For |
          | --- | --- |
          | `*.AppImage` | Any distribution. `chmod +x` and run. |
          | `*.deb` | Debian, Ubuntu, Mint. `sudo apt install ./aicampro_*.deb` |
          | `*.whl` / `*.tar.gz` | Installing into your own Python environment. |

          None of them bundle PyTorch. The ROCm build is around 14 GB installed
          and has to match your amdgpu driver, so it is fetched once by
          `aicampro-setup` (or `./AICamPro-*.AppImage --setup`).
          NOTE
          cat release-notes.md

      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "AICamPro $TAG" --notes-file release-notes.md --verify-tag
          fi
