name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  REF: ${{ github.event.inputs.tag || github.ref }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  check:
    name: lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # A release must never be cut from a tree that fails its own checks, so
      # these run here rather than trusting a green CI run on an earlier commit.
      - run: pip install ruff==0.16.3 pytest
      - run: ruff check aicampro tests
      - run: python -m pytest -q
      - name: Tag must match the version in pyproject
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "$TAG" = "v$VERSION" ] || { echo "Tag $TAG != pyproject $VERSION" >&2; exit 1; }

  python:
    name: sdist and wheel
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: actions/upload-artifact@v4
        with: { name: python-dist, path: dist/* }

  deb:
    name: deb package
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      # Không cài gì qua apt: dpkg-deb --root-owner-group thay được fakeroot, và
      # apt trên runner thỉnh thoảng treo vô hạn ở bước update. Cổng lintian nằm
      # trong workflow CI, chạy trên mọi lần push.
      - run: ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: dist/*.deb }

  rpm:
    name: rpm package
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Chạy trong container Fedora chứ không cài rpm qua apt trên runner: dnf
    # trong ảnh Fedora đáng tin hơn (apt trên runner từng treo vô hạn), và spec
    # được dựng bằng đúng rpmbuild mà người dùng Fedora sẽ cài gói bằng.
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - run: dnf -y --setopt=install_weak_deps=False install rpm-build python3
      - run: ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: dist/*.rpm }

  arch:
    name: Arch package
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # base-devel mang theo makepkg và fakeroot; `python` không nằm trong ảnh nên
    # phải cài thêm — lib-systree.sh đọc version từ pyproject.toml bằng tomllib.
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      # --disable-sandbox: pacman 7 dựng sandbox bằng landlock + seccomp, thứ
      # không dùng được trong container ("error restricting syscalls via seccomp").
      - run: pacman -Sy --noconfirm --needed --disable-sandbox python
      - run: ./packaging/build-arch.sh
      - uses: actions/upload-artifact@v4
        with: { name: arch, path: dist/*.pkg.tar.* }

  bundle:
    name: AppImage and tarball (${{ matrix.arch }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cả hai bản đều mang theo Python và Qt, dựng bằng chính interpreter
          # đó, nên không cross-build được: mỗi kiến trúc cần runner của nó.
          - { arch: x86_64, runner: ubuntu-latest }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      # No libfuse2 here on purpose: build-appimage.sh runs appimagetool with
      # --appimage-extract-and-run, so nothing needs to mount. Installing it was
      # not just redundant, it hung the job -- apt on 24.04 wants to swap
      # libfuse2 against libfuse2t64 and waits for an answer that never comes.
      #
      # Hai script dùng chung cache (~/.cache/aicampro-build) nên Python độc lập
      # chỉ tải một lần cho cả AppImage lẫn tar.gz.
      - run: ./packaging/build-appimage.sh
      - run: ./packaging/build-tarball.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  publish:
    name: publish
    needs: [python, deb, rpm, arch, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.inputs.tag || github.ref }}" }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }

      - name: Extract the release notes for this version
        run: |
          python - "$TAG" <<'PY' > release-notes.md
          import re, sys
          from pathlib import Path
          version = sys.argv[1].lstrip("v")
          text = Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\].*?$\n(.*?)(?=^## \[|\Z)",
                            text, re.MULTILINE | re.DOTALL)
          print(match.group(1).strip() if match
                else f"See CHANGELOG.md for the {version} entry.")
          PY
          cat >> release-notes.md <<'NOTE'

          ---

          ### Which download

          | File | For |
          | --- | --- |
          | `AICamPro-*-x86_64.AppImage` | Any distribution. `chmod +x` and run. |
          | `AICamPro-*-x86_64.tar.gz` | Same contents, no FUSE: extract, run `./AICamPro`. |
          | `aicampro_*_all.deb` | Debian, Ubuntu, Mint. `sudo apt install ./aicampro_*.deb` |
          | `aicampro-*.noarch.rpm` | Fedora, RHEL, openSUSE. `sudo dnf install ./aicampro-*.rpm` |
          | `aicampro-*-any.pkg.tar.zst` | Arch, Manjaro. `sudo pacman -U ./aicampro-*.pkg.tar.zst` |
          | `aicampro-*.whl`, `aicampro-<version>.tar.gz` | Installing into your own Python environment. |
          | `*-aarch64.AppImage`, `*-aarch64.tar.gz` | ARM64 machines. CPU only — see below. |

          Both `.tar.gz` shapes exist: `AICamPro-<version>-<arch>.tar.gz` is the
          portable build, `aicampro-<version>.tar.gz` is the Python sdist.

          None of them bundle PyTorch. The ROCm build is around 14 GB installed
          and has to match your amdgpu driver, so it is fetched once by
          `aicampro-setup` (or `./AICamPro-*.AppImage --setup`).

          ROCm publishes no ARM64 wheels, so on `aarch64` the setup step installs
          the CPU build of PyTorch instead and says so. Everything works, nothing
          is accelerated.
          NOTE
          cat release-notes.md

      - name: Publish or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "AICamPro $TAG" --notes-file release-notes.md --verify-tag
          fi
