name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: ruff's default rule set changes between releases, and this repo
      # selects rules explicitly in pyproject.toml so CI and developers agree.
      - run: pip install ruff==0.16.3
      - run: ruff check aicampro tests
      - run: ruff format --check --diff aicampro tests
        continue-on-error: true   # formatting is not enforced yet

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Every source file must at least parse on the oldest supported Python.
      - name: Byte-compile the package
        run: python -m compileall -q aicampro
      - run: pip install pytest
      # GitHub runners have no AMD GPU, so the GPU suite skips itself. What runs
      # here is the config and V4L2 ioctl coverage, which needs no hardware.
      - run: python -m pytest -v

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck run.sh scripts/*.sh packaging/*.sh packaging/aicampro-setup

  deb:
    name: deb package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: ./packaging/build-deb.sh
      - name: lintian must be clean
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends lintian
          lintian --fail-on warning --tag-display-limit 0 dist/*.deb

  rpm:
    name: rpm package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Cùng container với job phát hành, để lỗi spec lộ ra ở đây chứ không lộ ra
    # lúc cắt tag. Không cài rpm qua apt: apt trên runner thỉnh thoảng treo.
    container: fedora:41
    steps:
      - uses: actions/checkout@v4
      - run: dnf -y --setopt=install_weak_deps=False install rpm-build python3
      - run: ./packaging/build-rpm.sh
      - name: gói phải chứa đúng những file đã khai
        run: rpm -qplv dist/*.rpm

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      # --disable-sandbox: pacman 7 dựng sandbox bằng landlock + seccomp, thứ
      # không dùng được trong container ("error restricting syscalls via seccomp").
      # namcap là cổng kiểm tra của Arch; build-arch.sh tự gọi nếu thấy có.
      - run: pacman -Sy --noconfirm --needed --disable-sandbox python namcap
      - run: ./packaging/build-arch.sh

  bundle:
    name: AppImage and tarball
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Không chạy trên mọi lần push: job này tải khoảng 500 MB (Python độc lập +
    # Qt) nên chỉ chạy trên nhánh chính và khi gọi tay. Nó tồn tại vì cả AppImage
    # lẫn tar.gz dùng chung lib-payload.sh — sửa lib mà không có cổng nào chạy
    # thì lỗi chỉ lộ ra lúc cắt tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v4
      - run: ./packaging/build-appimage.sh
      - run: ./packaging/build-tarball.sh
      - name: AppImage phải khởi động được
        # --shell chạy đúng interpreter đi kèm mà không cần GPU hay màn hình.
        # APPIMAGE_EXTRACT_AND_RUN: runner không có libfuse2 nên không mount được
        # (và cài libfuse2 qua apt là cái đã từng treo job).
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/AICamPro-*.AppImage --shell \
            -c "import PySide6, cv2, numpy, pyvirtualcam; print('ok')"
      - name: bản tar.gz phải giải nén và chạy được
        run: |
          tar -xzf dist/AICamPro-*.tar.gz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP"/AICamPro-*/AICamPro --shell -c "import PySide6; print('ok')"

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
