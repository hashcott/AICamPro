name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: ruff's default rule set changes between releases, and this repo
      # selects rules explicitly in pyproject.toml so CI and developers agree.
      - run: pip install ruff==0.16.3
      - run: ruff check aicampro tests
      - run: ruff format --check --diff aicampro tests
        continue-on-error: true   # formatting is not enforced yet

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Every source file must at least parse on the oldest supported Python.
      - name: Byte-compile the package
        run: python -m compileall -q aicampro
      - run: pip install pytest
      # GitHub runners have no AMD GPU, so the GPU suite skips itself. What runs
      # here is the config and V4L2 ioctl coverage, which needs no hardware.
      - run: python -m pytest -v

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install shellcheck-py==0.11.0.1
      - run: shellcheck run.sh scripts/*.sh packaging/*.sh packaging/aicampro-setup

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
